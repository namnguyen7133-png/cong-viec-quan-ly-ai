<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Tracker</title>

<style>
body{font-family:Arial;background:#f4f6fa;padding:10px}
h2{margin-top:0}
input,select,button{padding:6px;margin:4px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
.good{background:#c8f7c5}
.bad{background:#f7c5c5}
.summary{margin-top:15px;background:#fff;padding:10px;border-radius:6px}
</style>
</head>

<body>

<h2>📊 Theo dõi Affiliate Shopee</h2>

<!-- FORM NHẬP -->
<div>
<input type="date" id="date">
<select id="platform">
  <option>Facebook</option>
  <option>Zalo</option>
</select>
<input type="text" id="post" placeholder="Tên bài">
<input type="text" id="subid" placeholder="Sub ID">
<input type="number" id="click" placeholder="Click">
<input type="number" id="order" placeholder="Đơn">
<input type="number" id="commission" placeholder="Hoa hồng">
<button onclick="addRow()">➕ Thêm</button>
<button onclick="exportCSV()">⬇ Xuất Excel</button>
</div>

<!-- BẢNG -->
<table id="table">
<tr>
<th>Ngày</th>
<th>Nền tảng</th>
<th>Bài</th>
<th>Sub ID</th>
<th>Click</th>
<th>Đơn</th>
<th>Hoa hồng</th>
<th>Trạng thái</th>
</tr>
</table>

<!-- THỐNG KÊ -->
<div class="summary">
<h3>📈 Thống kê</h3>
<p>Tổng click: <span id="tClick">0</span></p>
<p>Tổng đơn: <span id="tOrder">0</span></p>
<p>Tổng hoa hồng: <span id="tMoney">0</span> đ</p>
</div>

<script>
let data = JSON.parse(localStorage.getItem("affiliate")) || [];

function addRow(){
  let item = {
    date: date.value,
    platform: platform.value,
    post: post.value,
    subid: subid.value,
    click: +click.value,
    order: +order.value,
    commission: +commission.value
  };
  data.push(item);
  localStorage.setItem("affiliate",JSON.stringify(data));
  render();
}

function render(){
  let table = document.getElementById("table");
  table.innerHTML = table.rows[0].outerHTML;

  let tC=0,tO=0,tM=0;

  data.forEach(d=>{
    let status = (d.order>0) ? "GIỮ" : (d.click>=30 ? "BỎ" : "THEO DÕI");
    let cls = status=="GIỮ"?"good":status=="BỎ"?"bad":"";

    table.innerHTML += `
    <tr class="${cls}">
    <td>${d.date}</td>
    <td>${d.platform}</td>
    <td>${d.post}</td>
    <td>${d.subid}</td>
    <td>${d.click}</td>
    <td>${d.order}</td>
    <td>${d.commission}</td>
    <td>${status}</td>
    </tr>`;

    tC+=d.click; tO+=d.order; tM+=d.commission;
  });

  tClick.innerText=tC;
  tOrder.innerText=tO;
  tMoney.innerText=tM.toLocaleString();
}

function exportCSV(){
  let csv="Ngày,Nền tảng,Bài,Sub ID,Click,Đơn,Hoa hồng\n";
  data.forEach(d=>{
    csv+=`${d.date},${d.platform},${d.post},${d.subid},${d.click},${d.order},${d.commission}\n`;
  });
  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="affiliate-report.csv";
  a.click();
}

render();
</script>

</body>
</html>
