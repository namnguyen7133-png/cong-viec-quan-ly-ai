<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Affiliate Dashboard – Shopee</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff5722">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6fa;
  max-width:1100px;
  margin:auto;
  padding:15px;
}
h1{color:#ff5722}
.card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}
input,select,button{
  padding:8px;
  margin:5px 0;
  width:100%;
}
button{
  background:#ff5722;
  color:#fff;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
button:hover{opacity:.9}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
small{color:#777}
</style>
</head>

<body>

<h1>📊 Shopee Affiliate Dashboard</h1>

<div class="card">
<h3>➕ Thêm link mới</h3>
<input id="title" placeholder="Tên bài / sản phẩm">
<input id="platform" placeholder="Nền tảng (Facebook / Zalo…)">
<input id="link" placeholder="Link Shopee Affiliate">
<input id="click" type="number" placeholder="Số click (xem trong Shopee)">
<input id="order" type="number" placeholder="Số đơn">
<input id="money" type="number" placeholder="Hoa hồng (VNĐ)">
<button onclick="add()">Lưu link</button>
</div>

<div class="card">
<h3>📅 Lọc dữ liệu</h3>
<select id="filter" onchange="render()">
<option value="all">Tất cả</option>
<option value="week">7 ngày gần nhất</option>
<option value="month">30 ngày gần nhất</option>
</select>
<button onclick="exportCSV()">📤 Xuất Excel</button>
</div>

<div class="card">
<h3>📋 Danh sách link</h3>
<table>
<thead>
<tr>
<th>Bài</th>
<th>Nền tảng</th>
<th>Click</th>
<th>Đơn</th>
<th>Hoa hồng</th>
<th>Ngày</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<div class="card">
<h3>📈 Biểu đồ hoa hồng</h3>
<canvas id="chart"></canvas>
</div>

<script>
let data = JSON.parse(localStorage.getItem("aff")) || [];

function add(){
  data.push({
    title:title.value,
    platform:platform.value,
    link:link.value,
    click:+click.value||0,
    order:+order.value||0,
    money:+money.value||0,
    date:Date.now()
  });
  localStorage.setItem("aff",JSON.stringify(data));
  render();
}

function render(){
  let tbody="";
  let now=Date.now();
  let filter=document.getElementById("filter").value;
  let show=data.filter(i=>{
    let diff=(now-i.date)/86400000;
    if(diff>30) return false; // tự xóa sau 30 ngày
    if(filter==="week") return diff<=7;
    if(filter==="month") return diff<=30;
    return true;
  });

  show.forEach(i=>{
    tbody+=`
    <tr>
      <td>${i.title}</td>
      <td>${i.platform}</td>
      <td>${i.click}</td>
      <td>${i.order}</td>
      <td>${i.money.toLocaleString()}đ</td>
      <td><small>${new Date(i.date).toLocaleDateString()}</small></td>
    </tr>`;
  });
  document.getElementById("list").innerHTML=tbody;
  draw(show);
}

function draw(show){
  let ctx=document.getElementById("chart");
  let labels=show.map(i=>i.title);
  let values=show.map(i=>i.money);
  if(window.c) window.c.destroy();
  window.c=new Chart(ctx,{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        label:"Hoa hồng (VNĐ)",
        data:values
      }]
    }
  });
}

function exportCSV(){
  let csv="Tên,Nền tảng,Click,Đơn,Hoa hồng,Ngày\n";
  data.forEach(i=>{
    csv+=`${i.title},${i.platform},${i.click},${i.order},${i.money},${new Date(i.date).toLocaleDateString()}\n`;
  });
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download="affiliate.csv";
  a.click();
}

render();
</script>

</body>
</html>
