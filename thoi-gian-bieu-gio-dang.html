<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Affiliate Story + Alarm Machine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px;max-width:1000px;margin:auto}
h1{text-align:center;color:#b71c1c;font-size:30px}
h2{margin-top:25px}
input,textarea,select{width:100%;font-size:18px;padding:10px;margin-top:6px}
button{padding:10px 14px;font-size:18px;margin-top:10px;border:none;border-radius:6px;cursor:pointer}
.green{background:#2e7d32;color:#fff}
.blue{background:#1565c0;color:#fff}
.orange{background:#f57c00;color:#fff}
.card{background:#fff;padding:15px;margin-top:15px;border-radius:8px}
.small{font-size:16px;color:#555}
.story{white-space:pre-line;font-size:19px}
</style>
</head>

<body>

<h1>🤖 AFFILIATE STORY + ALARM</h1>

<div class="card">
<h2>⏰ Giờ đăng bài (tự nhắc)</h2>
<input type="time" id="alarm" value="19:30">
<button class="orange" onclick="setAlarm()">🔔 ĐẶT BÁO THỨC</button>
<div id="alarmStatus" class="small"></div>
</div>

<div class="card">
<h2>🔗 Thông tin sản phẩm</h2>
<label>Link sản phẩm</label>
<input id="link">

<label>Giá sản phẩm (VNĐ)</label>
<input id="price" type="number">

<label>% Hoa hồng</label>
<input id="commission" type="number" value="5">

<label>Chủ đề ngụ ngôn</label>
<select id="theme">
<option value="gia-dinh">Gia đình</option>
<option value="suc-khoe">Sức khỏe</option>
<option value="gia-dung">Gia dụng</option>
<option value="me-be">Mẹ & Bé</option>
<option value="cong-nghe">Công nghệ</option>
</select>

<button class="green" onclick="generate()">✍️ TẠO TRUYỆN + LƯU</button>
</div>

<div id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem("aff_story") || "[]");

// tự xóa sau 30 ngày
data = data.filter(i => Date.now() - i.time < 30*86400000);
save();

function save(){
 localStorage.setItem("aff_story", JSON.stringify(data));
 render();
}

function generate(){
 const link=document.getElementById("link").value.trim();
 if(!link){alert("Chưa có link");return;}

 const theme=document.getElementById("theme").value;
 let story="";

 const stories={
  "gia-dinh":`Có một gia đình nhỏ luôn chọn kỹ từng món đồ.
Họ hiểu rằng bình yên đến từ những lựa chọn đúng.

👉 Xem chi tiết tại đây:
${link}`,

  "suc-khoe":`Ngày xưa có người coi nhẹ sức khỏe,
đến khi mệt mới hiểu: an tâm là chọn đúng mỗi ngày.

👉 Tham khảo sản phẩm:
${link}`,

  "gia-dung":`Có một ngôi nhà lúc nào cũng gọn gàng,
vì chủ nhà chọn đồ đơn giản mà hiệu quả.

👉 Xem món này:
${link}`,

  "me-be":`Người mẹ hiểu rằng yêu con là chọn kỹ,
không cần nhiều, chỉ cần an toàn.

👉 Xem sản phẩm cho bé:
${link}`,

  "cong-nghe":`Công nghệ tốt không làm ta rối,
mà giúp cuộc sống nhẹ hơn mỗi ngày.

👉 Xem tại đây:
${link}`
 };

 story=stories[theme];

 data.unshift({
  link,
  price:+price.value,
  commission:+commission.value,
  story,
  click:0,
  time:Date.now()
 });
 save();
}

function render(){
 list.innerHTML="";
 data.forEach((i,idx)=>{
  const est = i.click*i.price*i.commission/100*0.02;
  list.innerHTML+=`
  <div class="card">
   <div class="story">${i.story}</div>
   <p><b>Click:</b> ${i.click} | <b>Ước:</b> ${Math.round(est).toLocaleString()}đ</p>
   <button class="orange" onclick="buy(${idx})">🛒 CLICK MUA</button>
   <button class="blue" onclick="copy('${i.story.replace(/'/g,"")}')">📋 COPY BÀI</button>
  </div>`;
 });
}

function buy(i){
 data[i].click++;
 save();
 window.open(data[i].link,'_blank');
}

function copy(t){
 navigator.clipboard.writeText(t);
 alert("Đã copy – dán đăng 👍");
}

// ALARM
function setAlarm(){
 const t=document.getElementById("alarm").value;
 document.getElementById("alarmStatus").innerText="⏰ Đã đặt: "+t;
 setInterval(()=>{
  const now=new Date();
  const h=String(now.getHours()).padStart(2,"0");
  const m=String(now.getMinutes()).padStart(2,"0");
  if(`${h}:${m}`===t){
   alert("🔔 ĐẾN GIỜ ĐĂNG BÀI AFFILIATE");
  }
 },60000);
}

render();
</script>

</body>
</html>
