<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Robot Quản Gia - Gemini Style</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fdfdfd; display: flex; justify-content: center; padding: 20px; }
        #chat-container { width: 900px; height: 85vh; background: white; display: flex; flex-direction: column; border: 1px solid #e0e0e0; border-radius: 12px; }
        #messages { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; gap: 30px; }
        
        /* Chữ to và thoáng như Gemini */
        .msg { font-size: 20px; line-height: 1.6; max-width: 85%; color: #1f1f1f; }
        .user-msg { align-self: flex-end; background: #f0f4f9; padding: 15px 25px; border-radius: 25px; }
        .bot-msg { align-self: flex-start; }
        
        #input-area { padding: 20px 40px; display: flex; border-top: 1px solid #eee; }
        input { flex: 1; padding: 18px 30px; border: 1px solid #757575; border-radius: 35px; font-size: 18px; outline: none; }
        button { margin-left: 15px; padding: 0 35px; background: #1a73e8; color: white; border: none; border-radius: 35px; cursor: pointer; font-weight: bold; }
        #loading { font-size: 14px; color: gray; margin-left: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="loading">Đang kết nối kho tri thức...</div>
    <div id="messages">
        <div class="msg bot-msg">Chào anh Nam! Em đã sẵn sàng. Anh muốn hỏi về chủ đề gì?[cite: 1]</div>
    </div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Nhập từ khóa..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    // 1. THAY LINK /EXEC CỦA ANH VÀO ĐÂY
    const API_URL = "https://script.google.com/macros/s/AKfycbzGjoq-gtpg_rfzpAxSMVbrKwtwTzXCbq2JK5LjVn1CbygiwXMUmP82FO38BqAQJROz/exec"; 
    let KHO_DU_LIEU = [];

    // 2. Tải dữ liệu ngay khi mở máy để tránh treo khi nhấn Gửi
    window.onload = async () => {
        try {
            const res = await fetch(API_URL);
            KHO_DU_LIEU = await res.json();
            document.getElementById('loading').innerText = "● Kho tri thức đã sẵn sàng";
        } catch (e) {
            document.getElementById('loading').innerText = "× Lỗi kết nối Sheets!";
        }
    };

    function sendMessage() {
        const input = document.getElementById('userInput');
        const msgDiv = document.getElementById('messages');
        const text = input.value.trim().toLowerCase();
        if (!text) return;

        // Hiển thị câu hỏi
        msgDiv.innerHTML += `<div class="msg user-msg">${input.value}</div>`;
        input.value = "";

        // 3. Tìm kiếm trong dữ liệu đã tải sẵn (Không lo treo máy)[cite: 1, 3]
        const match = KHO_DU_LIEU.find(item => {
            const k = item.tu_khoa ? item.tu_khoa.toString().toLowerCase() : "";
            const c = item.ca_dao ? item.ca_dao.toString().toLowerCase() : "";
            return k.includes(text) || c.includes(text);
        });

        let reply = match 
            ? `<b>Ca dao:</b> ${match.ca_dao}<br><br><b>Lời khuyên:</b> ${match.loi_khuyen}` 
            : "Em chưa tìm thấy thông tin này trong Sheets của anh.";

        msgDiv.innerHTML += `<div class="msg bot-msg">${reply}</div>`;
        msgDiv.scrollTop = msgDiv.scrollHeight;
    }
</script>
</body>
</html>
