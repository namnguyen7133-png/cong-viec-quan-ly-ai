<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Affiliate Dashboard PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:15px}
h1{margin-bottom:10px}
input,button{padding:8px;margin:4px}
button{cursor:pointer;border:none;border-radius:6px}
.container{max-width:1100px;margin:auto}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card.A{border-left:6px solid #28a745;background:#f3fff6}
.card.B{border-left:6px solid #ffc107;background:#fffdf3}
.card.C{border-left:6px solid #dc3545;background:#fff5f5}
.badge{padding:3px 8px;border-radius:6px;font-weight:bold}
.badge.A{background:#28a745;color:#fff}
.badge.B{background:#ffc107;color:#000}
.badge.C{background:#dc3545;color:#fff}
.bar{height:22px;margin:6px 0;border-radius:6px;color:#fff;font-size:13px;padding-left:8px;line-height:22px}
.bar.A{background:#28a745}
.bar.B{background:#ffc107;color:#000}
.bar.C{background:#dc3545}
</style>
</head>
<body>
<div class="container">
<h1>🚀 Affiliate Dashboard PRO</h1>

<div class="card">
<input id="link" placeholder="Link sản phẩm" style="width:40%">
<input id="clicks" type="number" placeholder="Click">
<input id="orders" type="number" placeholder="Đơn">
<input id="commission" type="number" placeholder="Hoa hồng">
<button onclick="addProduct()">➕ Thêm link</button>
</div>

<h3>📊 Hiệu suất</h3>
<div id="chart"></div>

<h3>📦 Danh sách link</h3>
<div id="list"></div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("products")||"[]");
const WEAK_DAYS = 3;

function scoreLink(p){
  const score =
    (p.clicks||0)*1 +
    (p.orders||0)*20 +
    (p.commission||0)/10000 +
    (p.days||1)*0.5;
  let grade="C";
  if(score>=80) grade="A";
  else if(score>=50) grade="B";
  return {score:Math.round(score),grade};
}

function addProduct(){
  const p={
    link:link.value,
    clicks:+clicks.value||0,
    orders:+orders.value||0,
    commission:+commission.value||0,
    days:1,
    created:Date.now()
  };
  products.push(p);
  save();
}

function removeProduct(i){
  if(confirm("Xóa link này?")){
    products.splice(i,1);
    save();
  }
}

function save(){
  localStorage.setItem("products",JSON.stringify(products));
  render();
}

function render(){
  const box=document.getElementById("list");
  box.innerHTML="";
  products.forEach((p,i)=>{
    const r=scoreLink(p);
    const d=document.createElement("div");
    d.className="card "+r.grade;
    d.innerHTML=`
      <div>🔗 ${p.link}</div>
      <div>📊 Điểm: <b>${r.score}</b></div>
      <div>🏷️ <span class="badge ${r.grade}">${r.grade}</span></div>
      <button onclick="removeProduct(${i})">❌ Xóa</button>
    `;
    box.appendChild(d);
  });
  renderChart();
  checkWeakLinks();
}

function renderChart(){
  const c=document.getElementById("chart");
  c.innerHTML="";
  products.forEach(p=>{
    const r=scoreLink(p);
    const b=document.createElement("div");
    b.className="bar "+r.grade;
    b.style.width=Math.min(r.score,100)+"%";
    b.textContent=r.grade+" | "+r.score;
    c.appendChild(b);
  });
}

function checkWeakLinks(){
  const now=Date.now();
  products.forEach(p=>{
    const r=scoreLink(p);
    const days=Math.floor((now-(p.created||now))/86400000);
    if(r.grade==="C" && days>=WEAK_DAYS){
      console.warn("Link yếu lâu ngày:",p.link);
    }
  });
}

render();
</script>
</body>
</html>
